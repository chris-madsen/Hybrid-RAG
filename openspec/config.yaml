schema: spec-driven
context: |
  Project: Adaptive Context Engine (ACE), an agent-neutral context/RAG engine.
  Source of truth: current explicit owner decisions, accepted ADRs, applicable OpenSpec capability contracts, then repository rules and current code/tests as implementation evidence.
  Core architecture: TypeScript + Effect modular monolith, Functional DDD, explicit ports/adapters and source-verified context.
  Agent-facing delivery: Bifröst LLM Gateway is the sole supported ACE context delivery path. Provider-native Responses is the only supported generation protocol; model-invoked ACE context tools and native Hermes ACE ContextEngine delivery are retired.
  Gateway ownership: ADR-021 and OpenSpec 010-gateway-only-ownership govern the single Bifröst gateway; 013-gateway-g11-production-acceptance governs current internal ace.context.v3 RPC and provider acceptance. Projection preserves the original native request and produces a receipt, not permission to send. Each protected physical attempt requires fresh single-use authorization bound to the final request, route, model and source/data policy; real final-wire and agent acceptance remain separate gates.
  Retrieval: native Codebase Memory (CBM) is the sole active code retrieval engine, owning Tree-sitter AST, graph, semantic and SQLite FTS5/BM25 discovery. ACE verifies original source bytes, exact UTF-8 ranges, SHA-256, workspace identity and freshness. No secondary vector index or ast-grep runtime parser; external LSP is separate deferred research, not evidence requested by the current code-only projection.
  Documentation: explicitly authorized Vertex project_document retrieval adapter; combined document delivery is not part of the current code-only native Responses projection. Source/private code stays local by default; model-bound transmission requires explicit policy authorization.
  Memory: independent immutable original session archive; local-first Graphiti/FalkorDB is the selected target for derived temporal memory, not configured in the current gateway-native runtime. Derived claims never outrank originals.
  Contracts: OpenSpec owns behavioral requirements and acceptance; TypeSpec owns selected versioned machine wire contracts. The authenticated loopback ace.context.v3 HTTP/JSON RPC (health, capabilities, project, authorize-attempt) is the sole active internal connector/engine contract; the provider-native Responses protocol is distinct. Prior internal RPC versions are retired; deploy matching Go and TypeScript artifacts together.
  Evaluation: Harbor for paired real-agent tasks; provider/agent G11 evidence remains distinct from structural/process closure.
  SDLC: for new material T2 scope, R Research -> S Requirements (ace-sdd-prepare, proposal.md and specs/**/spec.md; bounded Matt Pocock discovery and to-spec when needed) -> A Architecture (ace-architecture-design, design.md, Functional DDD/Event Storming, ADR, DbC and TypeSpec where applicable) -> P Plan (ace-to-tickets, tasks.md) -> X Executable Plans (ace-phase-plan and applicable ace-plan-refinement, phases/*.md) -> I Implementation (one phase) -> V Verification. T0/T1 use risk-scoped routes. Enter/resume the owner-requested stage with verified fresh artifacts; repair only stale owning stages and affected descendants. New unresolved material T2 choices require G02 before dependent edits; explicit owner-directed existing-phase offline implementation does not repeat G02. Provisional planning is permitted; provider egress and final acceptance remain separately gated. RED/GREEN where feasible, BUILD/ARCH/SEC/PLAN reviews, exact SHA evidence and honest PASS/FAIL/NOT-RUN/UNKNOWN.
  Quality gates: QG0/QG1 active; QG2 report-only architecture fitness; QG4 dependency/advisory reporting; QG5 TypeSpec native Responses contract generation; QG6 partial nightly assurance. Optional future gates are not closure blockers unless an owner promotes them.
  North Star: measure the hypothesis of at least 5x fewer total agent tokens per accepted task without quality loss. Never infer savings from retrieval hits, additive injection, mocks or missing telemetry.
  Security: authorization, policy and secrets fail closed; technical provider failures remain explicit and never become false empty success. Retrieved/source text is untrusted data, not executable instructions.
  Deployment: local-first; Hermes owns subscription OAuth, Bifröst forwards its bearer on the native subscription route and owns model dispatch, and ACE does neither. Internal context RPC is loopback-only and authenticated out of band.
