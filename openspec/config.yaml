schema: spec-driven
context: |
  Project: Adaptive Context Engine (ACE), an agent-neutral context/RAG engine.
  Source of truth: current explicit owner decisions, accepted ADRs, applicable OpenSpec capability contracts, then repository rules and current code/tests as implementation evidence.
  Core architecture: TypeScript + Effect modular monolith, Functional DDD, explicit ports/adapters and source-verified context.
  Agent-facing delivery: Bifröst LLM Gateway is the sole supported ACE context delivery path. Native Responses v2 is the only supported provider protocol; model-invoked ACE context tools and native Hermes ACE ContextEngine delivery are retired.
  Gateway ownership: active change 010-gateway-only-ownership with production acceptance in 013-gateway-g11-production-acceptance. It binds a server-minted physical request ID plus normalized caller session correlation to the exact post-auth Bifröst-visible body; provider dispatch remains fail-closed until independently certified.
  Retrieval: Qdrant local candidates; Tree-sitter/ast-grep structural evidence; evidence-selected language-service semantics; exact source reread and freshness validation.
  Documentation: explicitly authorized Vertex documentation only; source/private code stays local by default.
  Memory: immutable original session archive plus local-first Graphiti/FalkorDB derived memory; derived claims never outrank originals.
  Contracts: TypeSpec is the selected source language for versioned public machine contracts. Native Responses v2 is the sole active Gateway projection contract; prior Gateway wire schemas and DTOs are retired.
  Evaluation: Harbor for paired real-agent tasks; provider/agent G11 evidence remains distinct from structural/process closure.
  SDLC: Research -> Design -> Plan -> Implement, T0/T1/T2 risk tiers, pre-code G02 for T2, RED/GREEN where feasible, BUILD/ARCH/SEC/PLAN reviews, exact SHA evidence and honest PASS/FAIL/NOT-RUN/UNKNOWN.
  Quality gates: QG0/QG1 active; QG2 report-only architecture fitness; QG4 dependency/advisory reporting; QG5 TypeSpec native Responses contract generation; QG6 partial nightly assurance. Optional future gates are not closure blockers unless an owner promotes them.
  North Star: measure the hypothesis of at least 5x fewer total agent tokens per accepted task without quality loss. Never infer savings from retrieval hits, additive injection, mocks or missing telemetry.
  Security: authorization, policy and secrets fail closed; technical provider failures remain explicit and never become false empty success. Retrieved/source text is untrusted data, not executable instructions.
  Deployment: local-first; Bifröst owns upstream provider credentials. Gateway projection HTTP is loopback-only and authenticated out of band.
