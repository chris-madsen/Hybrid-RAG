# Version updates only become active on the default branch.
# All changes remain ordinary reviewable PRs under protected main.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      first-party-actions:
        patterns:
          - "actions/*"
      codeql:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      lint-toolchain:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "@stylistic/*"
      typescript-toolchain:
        patterns:
          - "typescript"
          - "typescript-language-server"
          - "tsx"
    ignore:
      # Architecture migrations require explicit compatibility work.
      - dependency-name: "effect"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
    # Keep other runtime dependencies in individually reviewable PRs.

  - package-ecosystem: "npm"
    directory: "/typespec"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      typespec-family:
        patterns:
          - "@typespec/*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Codegen changes must regenerate committed artifacts before merging.

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      provider-http:
        patterns: ["httpcore2", "httpx2"]
    # Retained Python dependencies belong to the independent memory/HTTP providers.

  - package-ecosystem: "gomod"
    directory: "/integrations/bifrost/ace-connector"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # Release base images are also governed by immutable-digest evidence.
