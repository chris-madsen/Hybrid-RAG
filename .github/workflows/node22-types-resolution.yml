name: Node 22 declaration resolution
on:
  push:
    branches: [codex/node22-types-355]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Resolve exact Node 22 declaration package
        run: |
          npm install --ignore-scripts --save-dev --save-exact '@types/node@22'
          npm ci --ignore-scripts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(readFileSync('package.json','utf8'));
          assert.match(manifest.devDependencies['@types/node'], /^22\.\d+\.\d+$/u);
          for (const path of ['package.json','package-lock.json']) {
            const encoded = readFileSync(path).toString('base64');
            const chunks = encoded.match(/.{1,10000}/g);
            chunks.forEach((data,i) => console.log('NODE22_FILE '+JSON.stringify({path,i,n:chunks.length,data})));
          }
          NODE
          npm run check
          npm run lint
          npm audit --audit-level=high
