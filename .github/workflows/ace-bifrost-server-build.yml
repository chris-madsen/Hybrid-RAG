name: ACE pinned Bifrost subscriber HTTP build

on:
  pull_request:
    paths:
      - 'scripts/build-bifrost-subscriber-server.sh'
      - 'scripts/build-bifrost-ace-plugin.sh'
      - 'scripts/bifrost-binary-admission-smoke.py'
      - 'integrations/bifrost/ace-connector/**'
      - 'docs/operations/gateway-subscription-oauth.md'
      - '.github/workflows/ace-bifrost-server-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-subscriber-http-build:
    # Source/ABI/zero-egress admission qualification, not provider-wire certification.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact required-plugin source pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chris-madsen/bifrost
          ref: 622eb7610d5c85572fcaed36a02c21f127d2a2f0
          path: .cache/bifrost-pinned
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: .cache/bifrost-pinned/ui/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Validate build script syntax
        run: bash -n scripts/build-bifrost-subscriber-server.sh
      - name: Compile server and plugin in one pinned Go workspace
        env:
          BIFROST_SOURCE_ROOT: ${{ github.workspace }}/.cache/bifrost-pinned
          BIFROST_COMMIT: 622eb7610d5c85572fcaed36a02c21f127d2a2f0
          OUTPUT: ${{ runner.temp }}/bifrost-pinned
          ACE_PLUGIN_OUTPUT: ${{ runner.temp }}/ace-bifrost-context.so
          BIFROST_VERIFY_REQUIRED_GUARD: 'true'
        run: bash scripts/build-bifrost-subscriber-server.sh
      - name: Execute real HTTP admission without any external network
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec runuser -u "$1" -- python3 "$2" "$3" "$4" "$5"' _ "$(id -un)" "$PWD/scripts/bifrost-binary-admission-smoke.py" "$RUNNER_TEMP/bifrost-pinned" "$RUNNER_TEMP/ace-bifrost-context.so" "$PWD/.cache/bifrost-pinned/examples/configs/withlocalpricingfiles"
