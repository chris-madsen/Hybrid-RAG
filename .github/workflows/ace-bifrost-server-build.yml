name: ACE pinned Bifrost subscriber HTTP build

on:
  pull_request:
    paths:
      - 'scripts/build-bifrost-subscriber-server.sh'
      - 'scripts/build-bifrost-ace-plugin.sh'
      - 'docs/operations/gateway-subscription-oauth.md'
      - '.github/workflows/ace-bifrost-server-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-subscriber-http-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout independently pinned Bifrost source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: chris-madsen/bifrost
          ref: 72f03b4b0d4a93b08e9fc0e5ebfe3447248af2a0
          path: .bifrost-src
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Compile pinned HTTP subscriber server with readonly modules
        env:
          BIFROST_SOURCE_ROOT: ${{ github.workspace }}/.bifrost-src
          OUTPUT: ${{ runner.temp }}/bifrost-subscriber-server
        run: bash scripts/build-bifrost-subscriber-server.sh
      - name: Verify executable exists and source remained clean
        env:
          BIFROST_SOURCE_ROOT: ${{ github.workspace }}/.bifrost-src
        run: |
          test -s "${RUNNER_TEMP}/bifrost-subscriber-server"
          test -z "$(git -C "$BIFROST_SOURCE_ROOT" status --porcelain --untracked-files=all)"
