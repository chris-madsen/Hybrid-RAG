name: Dependency cleanup inventory
on:
  push:
    branches: [codex/remove-retired-structural-dependencies]
    paths: ['.github/workflows/ace-dependency-cleanup-preview.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Inventory references and resolve dev-only lint package
        run: |
          git grep -nI -E 'tree[-_]sitter|ast[-_]grep[-_]py|astGrepCommand|ACE_AST_GREP_COMMAND|pygls|\.venv-system|@ast-grep/cli' -- . ':!package-lock.json' ':!typespec/package-lock.json' ':!benchmarks/reports/**' ':!*.jsonl' ':!.github/workflows/ace-dependency-cleanup-preview.yml' || test "$?" = 1
          npm install --ignore-scripts --save-dev --save-exact @ast-grep/cli@0.51.3
          npm ci --ignore-scripts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(readFileSync('package.json','utf8'));
          assert.equal(pkg.dependencies['@ast-grep/cli'], undefined);
          assert.equal(pkg.devDependencies['@ast-grep/cli'], '0.51.3');
          for (const path of ['package.json','package-lock.json']) {
            const chunks = readFileSync(path).toString('base64').match(/.{1,10000}/g);
            chunks.forEach((data,i) => console.log('CLEANUP_FILE '+JSON.stringify({path,i,n:chunks.length,data})));
          }
          NODE
          npm run check:arch
          npm run test:arch-rules
