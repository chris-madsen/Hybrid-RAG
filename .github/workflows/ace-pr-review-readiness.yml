name: Reviewable PR and documentation policy

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewable-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an ordinary reviewable pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Pull requests must be published in the regular ready-for-review state."
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0.4.0
        with:
          node-version: '22'
      - name: Reject obsolete terminology in tracked text documentation
        run: node scripts/reviewable-pr-policy-audit.mjs
