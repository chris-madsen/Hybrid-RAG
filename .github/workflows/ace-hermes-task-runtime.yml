name: Hermes actual task runtime probe

on:
  pull_request:
    paths:
      - 'scripts/hermes-task-runtime-probe.py'
      - 'scripts/ace-container-runtime-smoke.mjs'
      - 'src/domain/hermes-task-runtime-probe.ts'
      - '.github/workflows/ace-hermes-task-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 5b147ab036d6d19131bff8d20701b5001eab844a
          path: .cache/hermes-probe
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the pinned upstream dependency environment
        working-directory: .cache/hermes-probe
        run: | # zizmor: ignore[adhoc-packages] Hermes PM pins uv 0.12.3; upstream uv.lock owns dependency resolution
          python -m pip install --disable-pip-version-check uv==0.12.3
          uv sync --locked --no-dev --python "$(command -v python)"
      - name: Observe actual installed Hermes adapter without external network
        run: |
          endpoint=http://127.0.0.1:8765/chatgpt_passthrough/backend-api/codex
          endpoint_digest="$(printf '%s' "$endpoint" | sha256sum | cut -d ' ' -f1)"
          sudo unshare --net -- runuser -u "$(id -un)" -- env \
            PATH="$PWD/.cache/hermes-probe/.venv/bin:$PATH" HERMES_CODEX_BASE_URL="$endpoint" \
            "$PWD/.cache/hermes-probe/.venv/bin/python" "$PWD/scripts/hermes-task-runtime-probe.py" "$endpoint_digest" gpt-5.6-sol high
